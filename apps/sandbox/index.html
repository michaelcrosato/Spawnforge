<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spawnforge Sandbox</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="status">Starting…</div>
    <div id="controls">
      <select id="picker" aria-label="Creature"></select>
      <label><input type="checkbox" id="herd" /> herd</label>
      <label><input type="checkbox" id="wander" checked /> wander</label>
      <label>pace <input type="range" id="pace" min="0" max="100" value="50" /></label>
      <span id="pace-value"></span>
    </div>
    <div id="help">Click the ground to walk there · drag to orbit · scroll to zoom</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
