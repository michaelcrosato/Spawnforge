name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for headless renders
        run: pnpm --filter @spawnforge/render exec playwright-core install --with-deps chromium
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Smoke test the packed packages in a small game
        run: pnpm smoke
      - name: GPU bench, small (recorded, not gated; docs/design/11.3-crowds.md)
        run: pnpm bench --small --out bench-ci.json
        continue-on-error: true
      - name: Keep the bench's numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-ci
          path: bench-ci.json
          if-no-files-found: ignore
