name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for headless renders
        run: pnpm --filter @spawnforge/render exec playwright-core install --with-deps chromium
      - name: Blender as a Python module, for the engine import test (docs/engines.md)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          sudo apt-get install -y --no-install-recommends libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libxrender1 libxext6 libgl1 libegl1
          python -m pip install bpy==5.2.2
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          SPAWNFORGE_BPY_PYTHON: python
      - run: pnpm build
      - name: The gallery as an artifact (publishing waits for the owner; docs/design/12.2-gallery.md)
        uses: actions/upload-artifact@v4
        with:
          name: gallery
          path: apps/gallery/dist
      - name: Smoke test the packed packages in a small game
        run: pnpm smoke
      - name: GPU bench, small (recorded, not gated; docs/design/11.3-crowds.md)
        run: pnpm bench --small --out bench-ci.json
        continue-on-error: true
      - name: Keep the bench's numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-ci
          path: bench-ci.json
          if-no-files-found: ignore
